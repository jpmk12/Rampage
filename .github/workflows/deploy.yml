name: Deploy to GitHub Pages

# Builds the Vite/Phaser game and publishes the bundled dist/ to GitHub Pages.
# GitHub Pages must serve a BUILT site — the raw source index.html imports
# 'phaser' as a bare module the browser can't resolve, which shows a blank
# screen. This workflow does the build so that never happens.

on:
  push:
    branches:
      - main
      - claude/side-scroller-car-game-plan-709rc9
  workflow_dispatch: # lets you trigger a deploy manually from the Actions tab

# Permissions the deploy-pages action needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Serialize Pages deploys: let an in-progress run finish before the next starts,
# rather than cancelling it (cancelling mid-publish is what leaves the backend
# "in progress" and makes the next deploy fail).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Turns Pages on automatically (Source = GitHub Actions) if it isn't
      # already, so no manual repo setting is needed.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # GitHub's Pages backend can stay "in progress" for a few minutes after a
      # prior run reports success, which makes a fresh deploy fail with a 400
      # "in progress deployment" error. So we retry a couple of times with a
      # wait, which lets the previous deployment drain and self-heals.
      - name: Deploy to GitHub Pages (attempt 1)
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 90

      - name: Deploy to GitHub Pages (attempt 2)
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before final retry
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 120

      - name: Deploy to GitHub Pages (final attempt)
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v4
