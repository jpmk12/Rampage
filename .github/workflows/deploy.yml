name: Deploy to GitHub Pages

# Builds the Vite/Phaser game and publishes the bundled dist/ to GitHub Pages.
# GitHub Pages must serve a BUILT site — the raw source index.html imports
# 'phaser' as a bare module the browser can't resolve, which shows a blank
# screen. This workflow does the build so that never happens.

on:
  push:
    branches:
      - main
      - claude/side-scroller-car-game-plan-709rc9
  workflow_dispatch: # lets you trigger a deploy manually from the Actions tab

# Permissions the deploy-pages action needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; newer pushes cancel in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
